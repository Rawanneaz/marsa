<div class="container mt-4">
  <h1>{{ isEditMode ? 'Modifier Client' : 'Ajouter Client' }}</h1>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <label for="name">Nom</label>
      <input type="text" id="name" [(ngModel)]="client.name" name="name" class="form-control" required>
    </div>

    <div class="form-group mb-3">
      <label for="address">Adresse</label>
      <input type="text" id="address" [(ngModel)]="client.address" name="address" class="form-control" required>
    </div>

    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="client.email" name="email" class="form-control" required>
    </div>

    <div class="form-group mb-3">
      <label for="phone">Téléphone</label>
      <input type="text" id="phone" [(ngModel)]="client.phone" name="phone" class="form-control" required>
    </div>

    <div class="mt-3">
      <button type="submit" class="btn btn-success me-2">{{ isEditMode ? 'Modifier' : 'Ajouter' }}</button>
      <button type="button" class="btn btn-secondary" routerLink="/clients">Annuler</button>
    </div>
  </form>
</div>
